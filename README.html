<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星屿王国 · 放置传说</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(135deg,#1a1c20 0%,#2a2d35 50%,#1a1c20 100%);
  color:#EFE5CF;min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:20px;
}
.logo{
  width:120px;height:120px;margin-bottom:24px;
  background:radial-gradient(circle at 30% 30%,#F5D89A,#E8C46A 40%,#C49A30 100%);
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  box-shadow:0 0 40px rgba(232,196,106,0.4);
}
h1{font-size:32px;font-weight:800;letter-spacing:4px;color:#E8C46A;margin-bottom:8px}
p.subtitle{font-size:14px;color:#C5B193;letter-spacing:6px;margin-bottom:40px}
.btn{
  display:inline-block;padding:16px 48px;border-radius:30px;
  background:linear-gradient(135deg,#E8C46A,#C49A30);
  color:#2B2013;font-size:18px;font-weight:700;letter-spacing:2px;
  text-decoration:none;box-shadow:0 4px 20px rgba(232,196,106,0.4);
  transition:all 0.3s ease;margin:8px;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 30px rgba(232,196,106,0.6)}
.features{margin-top:48px;text-align:left;max-width:400px}
.features h3{color:#E8C46A;margin-bottom:16px;font-size:16px}
.features li{margin:8px 0;color:#C5B193;font-size:14px;list-style:none}
.features li:before{content:"✦ ";color:#E8C46A}
.github{margin-top:40px}
.github a{color:#7FB8FF;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="logo"></div>
<h1>星屿王国</h1>
<p class="subtitle">放 置 传 说</p>
<a href="index.html" class="btn">开始游戏</a>
<div class="features">
<h3>游戏特色</h3>
<ul>
<li>放置类玩法，轻松休闲</li>
<li>丰富的装备与技能系统</li>
<li>全服排行榜竞争</li>
<li>聊天互动社交</li>
<li>支持离线游玩</li>
</ul>
</div>
<div class="github">
<a href="https://github.com/king952701/stardust-kingdom">GitHub 仓库</a>
</div>
</body>
</html>
